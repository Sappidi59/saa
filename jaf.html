<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TTD Darshan Autofill Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    body {
      background-color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #111827;
      margin: 0;
      padding: 0;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #0284C7;
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.2);
    }
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #FFFFFF;
    }
    ::-webkit-scrollbar-thumb {
      background: #E5E7EB;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #9CA3AF;
    }
  </style>
</head>
<body class="p-4 flex items-center justify-center min-h-screen transition-colors duration-300">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const InlineMemberCard = ({ member, index, onUpdate, onDelete, isSrivani = false, darkMode = false }) => {
      const [expanded, setExpanded] = useState(false);
      const [isEditing, setIsEditing] = useState(false);
      const [editData, setEditData] = useState(member);

      useEffect(() => setEditData(member), [member]);

      const handleSave = (e) => {
        e.stopPropagation();
        onUpdate(editData);
        setIsEditing(false);
      };

      return (
        <div className={`border rounded-xl overflow-hidden shadow-sm mb-2 transition-all ${darkMode ? 'border-sky-800 bg-slate-800 text-sky-100' : 'border-[#E5E7EB] bg-[#FFFFFF] text-[#111827]'}`}>
          <div className={`p-2.5 flex items-center justify-between cursor-pointer ${darkMode ? 'hover:bg-slate-700' : 'hover:bg-[#F0F9FF]'}`} onClick={() => !isEditing && setExpanded(!expanded)}>
            <div className="flex-1">
              <p className={`font-bold text-xs ${darkMode ? 'text-sky-300' : 'text-[#111827]'}`}>{index + 1}. {member.name}</p>
              <p className={`text-[10px] ${darkMode ? 'text-slate-400' : 'text-[#6B7280]'}`}>{member.idType} • {member.idNum}</p>
            </div>
            <div className="flex items-center gap-1.5">
              <button onClick={(e) => { e.stopPropagation(); setIsEditing(true); setExpanded(true); }} className="px-2.5 py-1 bg-[#E0F2FE] hover:bg-[#F0F9FF] text-[#0284C7] rounded text-[10px] font-bold transition-colors">Edit</button>
              <button onClick={(e) => { e.stopPropagation(); onDelete(); }} className="px-2.5 py-1 bg-[#DC2626]/10 hover:bg-[#DC2626]/20 text-[#DC2626] rounded text-[10px] font-bold transition-colors">Delete</button>
              <span className={`ml-1 font-bold text-xs ${darkMode ? 'text-sky-400' : 'text-[#0284C7]'}`}>{expanded ? '▲' : '▼'}</span>
            </div>
          </div>
          
          {expanded && (
            <div className={`p-3 border-t ${darkMode ? 'border-sky-800 bg-slate-900/50' : 'border-[#E5E7EB] bg-[#FFFFFF]'}`}>
              {isEditing ? (
                <div className="space-y-2 text-xs">
                   <div className="grid grid-cols-2 gap-2">
                     <div><label className={`block text-[10px] font-bold mb-0.5 ${darkMode ? 'text-slate-300' : 'text-[#6B7280]'}`}>Name</label><input className={`w-full p-1.5 border rounded font-bold ${darkMode ? 'border-sky-700 bg-slate-800 text-sky-200' : 'border-[#E5E7EB] bg-[#FFFFFF] text-[#111827]'}`} value={editData.name} onChange={e=>setEditData({...editData, name: e.target.value})} /></div>
                     <div><label className={`block text-[10px] font-bold mb-0.5 ${darkMode ? 'text-slate-300' : 'text-[#6B7280]'}`}>Age</label><input type="number" className={`w-full p-1.5 border rounded font-bold ${darkMode ? 'border-sky-700 bg-slate-800 text-sky-200' : 'border-[#E5E7EB] bg-[#FFFFFF] text-[#111827]'}`} value={editData.age} onChange={e=>setEditData({...editData, age: parseInt(e.target.value) || ''})} /></div>
                   </div>
                   <div className="grid grid-cols-2 gap-2">
                     <div>
                       <label className={`block text-[10px] font-bold mb-0.5 ${darkMode ? 'text-slate-300' : 'text-[#6B7280]'}`}>Gender</label>
                       <select className={`w-full p-1.5 border rounded font-bold ${darkMode ? 'border-sky-700 bg-slate-800 text-sky-200' : 'border-[#E5E7EB] bg-[#FFFFFF] text-[#111827]'}`} value={editData.gender} onChange={e=>setEditData({...editData, gender: e.target.value})}>
                          <option>Male</option><option>Female</option><option>Transgender</option>
                       </select>
                     </div>
                     <div>
                       <label className={`block text-[10px] font-bold mb-0.5 ${darkMode ? 'text-slate-300' : 'text-[#6B7280]'}`}>ID Type</label>
                       <select className={`w-full p-1.5 border rounded font-bold ${darkMode ? 'border-sky-700 bg-slate-800 text-sky-200' : 'border-[#E5E7EB] bg-[#FFFFFF] text-[#111827]'}`} value={editData.idType} onChange={e=>setEditData({...editData, idType: e.target.value})}>
                          <option>Aadhaar Card</option><option>Passport</option>
                       </select>
                     </div>
                   </div>
                   <div><label className={`block text-[10px] font-bold mb-0.5 ${darkMode ? 'text-slate-300' : 'text-[#6B7280]'}`}>ID Number</label><input className={`w-full p-1.5 border rounded font-bold font-mono ${darkMode ? 'border-sky-700 bg-slate-800 text-sky-200' : 'border-[#E5E7EB] bg-[#FFFFFF] text-[#111827]'}`} value={editData.idNum} onChange={e=>setEditData({...editData, idNum: e.target.value})} /></div>
                   {!isSrivani && <div><label className={`block text-[10px] font-bold mb-0.5 ${darkMode ? 'text-slate-300' : 'text-[#6B7280]'}`}>Gothram</label><input className={`w-full p-1.5 border rounded font-bold ${darkMode ? 'border-sky-700 bg-slate-800 text-sky-200' : 'border-[#E5E7EB] bg-[#FFFFFF] text-[#111827]'}`} value={editData.gothram || ''} onChange={e=>setEditData({...editData, gothram: e.target.value})} /></div>}
                   
                   <div className="flex gap-2 justify-end pt-2">
                     <button onClick={(e) => { e.stopPropagation(); setIsEditing(false); setEditData(member); }} className={`px-3 py-1.5 rounded-lg font-bold ${darkMode ? 'bg-slate-700 text-slate-300 hover:bg-slate-600' : 'bg-[#E5E7EB] text-[#111827] hover:bg-[#9CA3AF]'}`}>Cancel</button>
                     <button onClick={handleSave} className="px-3 py-1.5 bg-[#0284C7] hover:bg-[#0369A1] text-white rounded-lg font-bold shadow-sm">Update</button>
                   </div>
                </div>
              ) : (
                <div className={`grid grid-cols-2 gap-y-1.5 gap-x-2 text-[11px] ${darkMode ? 'text-slate-300' : 'text-[#6B7280]'}`}>
                   <p><strong className={darkMode ? 'text-white' : 'text-[#111827]'}>Age:</strong> {member.age}</p>
                   <p><strong className={darkMode ? 'text-white' : 'text-[#111827]'}>Gender:</strong> {member.gender}</p>
                   <p><strong className={darkMode ? 'text-white' : 'text-[#111827]'}>ID Type:</strong> {member.idType}</p>
                   <p><strong className={`font-mono ${darkMode ? 'text-white' : 'text-[#111827]'}`}>ID Num:</strong> {member.idNum}</p>
                   {!isSrivani && member.gothram && <p className="col-span-2"><strong className={darkMode ? 'text-white' : 'text-[#111827]'}>Gothram:</strong> {member.gothram}</p>}
                </div>
              )}
            </div>
          )}
        </div>
      );
    };

    const InlineGroupCard = ({ member, index, onUpdate, onDelete, darkMode = false }) => {
      const [expanded, setExpanded] = useState(false);
      const [isEditing, setIsEditing] = useState(false);
      const [editData, setEditData] = useState(member);

      useEffect(() => setEditData(member), [member]);

      const handleSave = (e) => {
        e.stopPropagation();
        onUpdate(editData);
        setIsEditing(false);
      };

      return (
        <div className={`border rounded-xl overflow-hidden shadow-sm mb-2 transition-all ${darkMode ? 'border-sky-800 bg-slate-800 text-sky-100' : 'border-[#E5E7EB] bg-[#FFFFFF] text-[#111827]'}`}>
          <div className={`p-2.5 flex items-center justify-between cursor-pointer ${darkMode ? 'hover:bg-slate-700' : 'hover:bg-[#F0F9FF]'}`} onClick={() => !isEditing && setExpanded(!expanded)}>
            <div className="flex-1">
              <p className={`font-bold text-xs ${darkMode ? 'text-sky-300' : 'text-[#111827]'}`}>#{member.id} {member.name} {member.id === 1 ? "(Leader)" : ""}</p>
              <p className={`text-[10px] ${darkMode ? 'text-slate-400' : 'text-[#6B7280]'}`}>{member.idType} • {member.idNumber}</p>
            </div>
            <div className="flex items-center gap-1.5">
              <button onClick={(e) => { e.stopPropagation(); setIsEditing(true); setExpanded(true); }} className="px-2.5 py-1 bg-[#E0F2FE] hover:bg-[#F0F9FF] text-[#0284C7] rounded text-[10px] font-bold transition-colors">Edit</button>
              <button onClick={(e) => { e.stopPropagation(); onDelete(); }} className="px-2.5 py-1 bg-[#DC2626]/10 hover:bg-[#DC2626]/20 text-[#DC2626] rounded text-[10px] font-bold transition-colors">Delete</button>
              <span className={`ml-1 font-bold text-xs ${darkMode ? 'text-sky-400' : 'text-[#0284C7]'}`}>{expanded ? '▲' : '▼'}</span>
            </div>
          </div>
          
          {expanded && (
            <div className={`p-3 border-t ${darkMode ? 'border-sky-800 bg-slate-900/50' : 'border-[#E5E7EB] bg-[#FFFFFF]'}`}>
              {isEditing ? (
                <div className="space-y-2 text-xs">
                   <div className="grid grid-cols-2 gap-2">
                     <div><label className={`block text-[10px] font-bold mb-0.5 ${darkMode ? 'text-slate-300' : 'text-[#6B7280]'}`}>Name</label><input className={`w-full p-1.5 border rounded font-bold ${darkMode ? 'border-sky-700 bg-slate-800 text-sky-200' : 'border-[#E5E7EB] bg-[#FFFFFF] text-[#111827]'}`} value={editData.name} onChange={e=>setEditData({...editData, name: e.target.value})} /></div>
                     <div><label className={`block text-[10px] font-bold mb-0.5 ${darkMode ? 'text-slate-300' : 'text-[#6B7280]'}`}>Mobile</label><input className={`w-full p-1.5 border rounded font-bold ${darkMode ? 'border-sky-700 bg-slate-800 text-sky-200' : 'border-[#E5E7EB] bg-[#FFFFFF] text-[#111827]'}`} value={editData.mobileNumber} onChange={e=>setEditData({...editData, mobileNumber: e.target.value})} /></div>
                   </div>
                   <div className="grid grid-cols-2 gap-2">
                     <div><label className={`block text-[10px] font-bold mb-0.5 ${darkMode ? 'text-slate-300' : 'text-[#6B7280]'}`}>Age</label><input type="number" className={`w-full p-1.5 border rounded font-bold ${darkMode ? 'border-sky-700 bg-slate-800 text-sky-200' : 'border-[#E5E7EB] bg-[#FFFFFF] text-[#111827]'}`} value={editData.age} onChange={e=>setEditData({...editData, age: parseInt(e.target.value) || ''})} /></div>
                     <div><label className={`block text-[10px] font-bold mb-0.5 ${darkMode ? 'text-slate-300' : 'text-[#6B7280]'}`}>ID Number</label><input className={`w-full p-1.5 border rounded font-bold font-mono ${darkMode ? 'border-sky-700 bg-slate-800 text-sky-200' : 'border-[#E5E7EB] bg-[#FFFFFF] text-[#111827]'}`} value={editData.idNumber} onChange={e=>setEditData({...editData, idNumber: e.target.value})} /></div>
                   </div>
                   <div className="grid grid-cols-2 gap-2">
                     <div><label className={`block text-[10px] font-bold mb-0.5 ${darkMode ? 'text-slate-300' : 'text-[#6B7280]'}`}>City</label><input className={`w-full p-1.5 border rounded font-bold ${darkMode ? 'border-sky-700 bg-slate-800 text-sky-200' : 'border-[#E5E7EB] bg-[#FFFFFF] text-[#111827]'}`} value={editData.city} onChange={e=>setEditData({...editData, city: e.target.value})} /></div>
                     <div><label className={`block text-[10px] font-bold mb-0.5 ${darkMode ? 'text-slate-300' : 'text-[#6B7280]'}`}>Pincode</label><input className={`w-full p-1.5 border rounded font-bold ${darkMode ? 'border-sky-700 bg-slate-800 text-sky-200' : 'border-[#E5E7EB] bg-[#FFFFFF] text-[#111827]'}`} value={editData.pincode} onChange={e=>setEditData({...editData, pincode: e.target.value})} /></div>
                   </div>
                   
                   <div className="flex gap-2 justify-end pt-2">
                     <button onClick={(e) => { e.stopPropagation(); setIsEditing(false); setEditData(member); }} className={`px-3 py-1.5 rounded-lg font-bold ${darkMode ? 'bg-slate-700 text-slate-300 hover:bg-slate-600' : 'bg-[#E5E7EB] text-[#111827] hover:bg-[#9CA3AF]'}`}>Cancel</button>
                     <button onClick={handleSave} className="px-3 py-1.5 bg-[#0284C7] hover:bg-[#0369A1] text-white rounded-lg font-bold shadow-sm">Update</button>
                   </div>
                </div>
              ) : (
                <div className={`grid grid-cols-2 gap-y-1.5 gap-x-2 text-[11px] ${darkMode ? 'text-slate-300' : 'text-[#6B7280]'}`}>
                   <p><strong className={darkMode ? 'text-white' : 'text-[#111827]'}>Age:</strong> {member.age}</p>
                   <p><strong className={darkMode ? 'text-white' : 'text-[#111827]'}>Mobile:</strong> {member.mobileNumber}</p>
                   <p><strong className={darkMode ? 'text-white' : 'text-[#111827]'}>ID Type:</strong> {member.idType}</p>
                   <p><strong className={`font-mono ${darkMode ? 'text-white' : 'text-[#111827]'}`}>ID Num:</strong> {member.idNumber}</p>
                   <p className="col-span-2"><strong className={darkMode ? 'text-white' : 'text-[#111827]'}>Location:</strong> {member.city}, {member.state} - {member.pincode}</p>
                </div>
              )}
            </div>
          )}
        </div>
      );
    };

    const SectionWrapper = ({ title, children, defaultOpen = true, containerClass = "", titleClass = "", headerClass = "", darkMode = false }) => {
      const [isOpen, setIsOpen] = useState(defaultOpen);
      const defaultContainer = darkMode ? "bg-slate-800 border-sky-800 text-slate-100" : "bg-[#FFFFFF] border-[#E5E7EB]";
      const defaultTitle = darkMode ? "text-sky-300" : "text-[#0284C7]";
      return (
        <div className={`border rounded-xl transition-all duration-200 shadow-sm ${containerClass || defaultContainer}`}>
          <div 
            className={`px-4 py-3 flex items-center justify-between cursor-pointer select-none transition-colors rounded-t-xl ${!isOpen ? 'rounded-b-xl' : ''} ${darkMode ? 'hover:bg-slate-700/60' : 'hover:bg-[#F0F9FF]'} ${headerClass}`}
            onClick={() => setIsOpen(!isOpen)}
          >
            <div className="flex-1">
              {typeof title === 'string' ? <h4 className={`font-extrabold text-xs uppercase tracking-wide ${titleClass || defaultTitle}`}>{title}</h4> : title}
            </div>
            <span className={`font-bold text-xs ml-3 flex-shrink-0 transition-transform duration-200 ${isOpen ? 'rotate-180' : ''} ${titleClass || defaultTitle}`}>▼</span>
          </div>
          {isOpen && (
            <div className={`p-4 pt-3 space-y-3 border-t ${darkMode ? 'border-sky-900' : 'border-[#E5E7EB]'}`}>
              {children}
            </div>
          )}
        </div>
      );
    };

          street: "Temple Road",
          doorNumber: `12-${i+1}`,
          pincode: "517501",
          country: "India",
          state: "Andhra Pradesh",
          district: "Chittoor",
          city: "Tirupati",
          nearestTemple: "Tirumala Balaji"
        }))
      );

      const [selectedRenewalPlan, setSelectedRenewalPlan] = useState({ duration: "30 Days", price: 199 });
      const [couponCode, setCouponCode] = useState("");
      const [toasts, setToasts] = useState([]);

      const addToast = (msg) => {
        const id = Date.now() + Math.random();
        setToasts(prev => [...prev, { id, msg }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 2500);
      };

      const updatePilgrimMember = (setName, index, updatedMember) => {
        setPilgrimSets(pilgrimSets.map(s => {
          if (s.name === setName) {
            const newMembers = [...s.members];
            newMembers[index] = updatedMember;
            return { ...s, members: newMembers };
          }
          return s;
        }));
        addToast("Pilgrim updated successfully!");
      };

      const deletePilgrimMember = (setName, index) => {
        setPilgrimSets(pilgrimSets.map(s => {
          if (s.name === setName) {
            return { ...s, members: s.members.filter((_, i) => i !== index) };
          }
          return s;
        }));
        addToast("Pilgrim deleted.");
      };

      const updateSrivaniMember = (index, updatedMember) => {
        const newMembers = [...srivaniMembers];
        newMembers[index] = updatedMember;
        setSrivaniMembers(newMembers);
        addToast("Srivani member updated!");
      };

      const deleteSrivaniMember = (index) => {
        setSrivaniMembers(srivaniMembers.filter((_, i) => i !== index));
        addToast("Srivani member deleted.");
      };

      const updateGroupMember = (index, updatedMember) => {
        const newMembers = [...groupMembers];
        newMembers[index] = updatedMember;
        setGroupMembers(newMembers);
        addToast("Group member updated!");
      };

      const deleteGroupMember = (index) => {
        setGroupMembers(groupMembers.filter((_, i) => i !== index));
        addToast("Group member deleted.");
      };

      const handleAddPilgrimToSet = (e) => {
        e.preventDefault();
        if (!newName.trim() || !newIdNum.trim()) {
          addToast("Please fill Name and ID Proof Number");
          return;
        }

        const existingSet = pilgrimSets.find(s => s.name === newSetNameInput);
        if (existingSet && existingSet.members.length >= 6) {
          addToast("Max 6 members allowed per set!");
          return;
        }

        const newMember = {
          name: newName,
          age: parseInt(newAge) || 30,
          gender: newGender,
          idType: newIdType,
          idNum: newIdNum,
          email: addEmail,
          city: addCity,
          state: addState,
          country: addCountry,
          pincode: addPincode,
          gothram: addGothram
        };

        if (existingSet) {
          setPilgrimSets(pilgrimSets.map(s => s.name === newSetNameInput ? { ...s, members: [...s.members, newMember] } : s));
        } else {
          setPilgrimSets([...pilgrimSets, { id: Date.now().toString(), name: newSetNameInput, members: [newMember] }]);
        }

        addToast(`Successfully added ${newName} to set "${newSetNameInput}"`);
        setNewName("");
        setNewAge("");
        setNewIdNum("");
        setAddEmail("");
        setAddCity("");
        setAddState("");
        setAddPincode("");
        setAddGothram("");
      };

      const handleAddSrivaniPerson = (e) => {
        e.preventDefault();
        if (!srivaniNewName.trim() || !srivaniNewIdNum.trim()) {
          addToast("Please fill Name and ID Proof Number");
          return;
        }
        if (srivaniMembers.length >= 9) {
          addToast("Maximum 9 people allowed for Srivani quota!");
          return;
        }
        const newPerson = {
          name: srivaniNewName,
          age: parseInt(srivaniNewAge) || 30,
          gender: srivaniNewGender,
          idType: srivaniNewIdType,
          idNum: srivaniNewIdNum
        };
        setSrivaniMembers([...srivaniMembers, newPerson]);
        addToast(`Added ${srivaniNewName} to Srivani roster`);
        setSrivaniNewName("");
        setSrivaniNewAge("");
        setSrivaniNewIdNum("");
      };

      const copyAddressToAllGroupMembers = () => {
        const leader = groupMembers[0];
        setGroupMembers(groupMembers.map(m => ({
          ...m,
          street: leader.street,
          doorNumber: leader.doorNumber,
          pincode: leader.pincode,
          country: leader.country,
          state: leader.state,
          district: leader.district,
          city: leader.city,
          nearestTemple: leader.nearestTemple
        })));
        addToast("Copied Team Leader address to all 15 members!");
      };

      const activeSetData = pilgrimSets.find(s => s.name === selectedSetName) || pilgrimSets[0];
      const currentGroupMember = groupMembers[selectedGroupMember - 1] || groupMembers[0];

      return (
        <div className="flex flex-col items-center w-full max-w-6xl mx-auto space-y-2">
          
          {/* Top Box / Header Container */}
          <div style={{ width: viewMode === "popup" ? '520px' : '100%', maxWidth: '100%' }} className={`border rounded-2xl p-3 px-4 flex items-center justify-between shadow-md transition-all ${darkMode ? 'bg-slate-800 border-sky-800 text-[#FFFFFF]' : 'bg-[#0284C7] border-[#0284C7] text-[#FFFFFF]'}`}>
            <div className="flex items-center gap-2">
              <span className="text-lg">🏛️</span>
              <h1 className="font-black text-xs md:text-sm tracking-wide text-[#FFFFFF]">
                TTD DARSHAN AUTOFILL ASSISTANT
              </h1>
            </div>
            
            <div className="flex items-center gap-2">
              <button 
                onClick={() => setShowDisclaimerModal(true)}
                className={`px-2.5 py-1 rounded-xl text-[10px] font-extrabold border transition-all shadow-xs flex items-center gap-1 ${
                  darkMode 
                    ? 'bg-sky-900/60 hover:bg-sky-800 border-sky-700 text-sky-200' 
                    : 'bg-[#FFFFFF]/10 hover:bg-[#FFFFFF]/20 border-[#FFFFFF]/30 text-[#FFFFFF]'
                }`}
                title="View Legal Disclaimer"
              >
                <span>⚠️ Disclaimer</span>
              </button>

              <button 
                onClick={() => { setViewMode("dashboard"); setDashboardTab("demo"); }}
                className={`px-2.5 py-1 rounded-xl text-xs font-extrabold border transition-all shadow-xs flex items-center gap-1 ${
                  darkMode 
                    ? 'bg-sky-900/60 hover:bg-sky-800 border-sky-700 text-sky-200' 
                    : 'bg-[#FFFFFF]/10 hover:bg-[#FFFFFF]/20 border-[#FFFFFF]/30 text-[#FFFFFF]'
                }`}
                title="View Step-by-Step Demo Guide"
              >
                <span>📖 Demo</span>
              </button>

              <button 
                onClick={() => {
                  setDarkMode(!darkMode);
                  addToast(darkMode ? "Switched to Light Mode" : "Switched to Dark Mode");
                }}
                className={`p-1.5 px-2.5 rounded-xl border text-xs font-bold transition-all shadow-xs ${
                  darkMode 
                    ? 'bg-sky-900/60 hover:bg-sky-800 border-sky-700 text-sky-200' 
                    : 'bg-[#E0F2FE] hover:bg-[#F0F9FF] border-[#E5E7EB] text-[#0284C7]'
                }`}
                title={darkMode ? "Switch to Light Mode" : "Switch to Dark Mode"}
              >
                {darkMode ? "☀️" : "🌙"}
              </button>
            </div>
          </div>

          {viewMode === "popup" ? (
            <div 
              style={{ width: '520px', maxWidth: '100%' }}
              className={`border rounded-2xl shadow-xl overflow-hidden flex flex-col transition-all ${darkMode ? 'bg-slate-900 border-sky-800 text-slate-100' : 'bg-[#FFFFFF] border-[#E5E7EB] text-[#111827]'}`}
            >
              <div className={`border-b px-4 py-3 flex items-center justify-between gap-2 ${darkMode ? 'bg-slate-900 border-sky-800' : 'bg-[#FFFFFF] border-[#E5E7EB]'}`}>
                <div className="flex-1 flex items-center gap-2">
                  <button 
                    onClick={() => { setViewMode("dashboard"); setDashboardTab("dashboard"); }}
                    className="flex-1 py-2 bg-[#0284C7] hover:bg-[#0369A1] text-[#FFFFFF] rounded-xl text-xs font-extrabold shadow-xs flex items-center justify-center gap-1.5 transition-all"
                  >
                    <span>🖥️ MASTER DASHBOARD</span>
                  </button>
                </div>

                <div className="flex items-center gap-1.5 flex-shrink-0">
                  <button 
                    onClick={() => { setViewMode("dashboard"); setDashboardTab("renewal"); }}
                    className={`p-2 border rounded-xl text-xs font-bold shadow-xs ${darkMode ? 'bg-slate-800 hover:bg-slate-700 text-sky-200 border-sky-800' : 'bg-[#FFFFFF] hover:bg-[#F0F9FF] text-[#0369A1] border-[#E5E7EB]'}`}
                    title="Settings"
                  >
                    ⚙️
                  </button>
                  <select 
                    value={language}
                    onChange={e => { setLanguage(e.target.value); addToast(`Language: ${e.target.value}`); }}
                    className={`px-2 py-2 border rounded-xl text-xs font-bold ${darkMode ? 'bg-slate-800 border-sky-800 text-sky-200' : 'bg-[#FFFFFF] border-[#E5E7EB] text-[#0369A1]'}`}
                  >
                    <option value="EN">🌐 EN</option>
                    <option value="TE">🌐 తె</option>
                  </select>
                </div>
              </div>

              <div className={`p-2.5 border-b space-y-2 ${darkMode ? 'bg-slate-800/80 border-sky-800' : 'bg-[#F0F9FF] border-[#E5E7EB]'}`}>
                <div className={`grid grid-cols-4 gap-1 p-1 rounded-xl border ${darkMode ? 'bg-slate-900 border-sky-800' : 'bg-[#FFFFFF] border-[#E5E7EB]'}`}>
                  {[
                    { id: "booking", label: "👤 Pilgrim Booking" },
                    { id: "srivani", label: "✨ Srivani" },
                    { id: "seva", label: "🙏 Srivari Seva" },
                    { id: "group", label: "👥 Seva Group" }
                  ].map(tab => {
                    const isActive = activeTab === tab.id;
                    return (
                      <button
                        key={tab.id}
                        onClick={() => setActiveTab(tab.id)}
                        className={`py-2 text-[11px] font-extrabold rounded-lg transition-all text-center ${
                          isActive 
                            ? darkMode ? "bg-sky-900/70 text-sky-200 border border-sky-700 shadow-xs" : "bg-[#E0F2FE] text-[#0369A1] border border-[#E0F2FE] shadow-xs"
                            : darkMode ? "text-slate-400 hover:text-white hover:bg-slate-800 border border-transparent" : "text-[#6B7280] hover:text-[#111827] hover:bg-[#F0F9FF] border border-transparent"
                        }`}
                      >
                        {tab.label}
                      </button>
                    );
                  })}
                </div>

                <div className={`px-2 py-1.5 border rounded-lg flex items-center justify-between text-xs shadow-xs ${darkMode ? 'bg-slate-900 border-sky-800 text-slate-300' : 'bg-[#FFFFFF] border-[#E5E7EB]'}`}>
                  <span className="font-semibold text-[#9CA3AF]">Portal:</span>
                  {activeTab === "booking" && (
                    <a href="https://ttdevasthanams.ap.gov.in" target="_blank" rel="noreferrer" className="font-extrabold text-[#0284C7] hover:underline flex items-center gap-1">
                      <span>🏛️ Official Website ↗</span>
                    </a>
                  )}
                  {activeTab === "srivani" && (
                    <a href="https://ttdevasthanams.ap.gov.in" target="_blank" rel="noreferrer" className="font-extrabold text-[#0284C7] hover:underline flex items-center gap-1">
                      <span>✨ Srivani Portal ↗</span>
                    </a>
                  )}
                  {activeTab === "seva" && (
                    <a href="https://ttdevasthanams.ap.gov.in" target="_blank" rel="noreferrer" className="font-extrabold text-[#16A34A] hover:underline flex items-center gap-1">
                      <span>🙏 Srivari Seva Portal ↗</span>
                    </a>
                  )}
                  {activeTab === "group" && (
                    <a href="https://ttdevasthanams.ap.gov.in" target="_blank" rel="noreferrer" className="font-extrabold text-[#0284C7] hover:underline flex items-center gap-1">
                      <span>👥 Seva Group Portal ↗</span>
                    </a>
                  )}
                </div>
              </div>

              {activeTab === "booking" && (
                <div className="p-4 space-y-3.5 text-xs">
                  <div className={`p-3 border rounded-xl space-y-2.5 ${darkMode ? 'bg-slate-800 border-sky-800' : 'bg-[#F0F9FF] border-[#E5E7EB]'}`}>
                    <div className="flex items-center justify-between">
                      <span className={`font-extrabold text-xs ${darkMode ? 'text-sky-300' : 'text-[#0369A1]'}`}>FILL CONTINUE DEFAULT</span>
                      <div className={`flex gap-1 p-0.5 rounded-lg border ${darkMode ? 'bg-slate-900 border-sky-800' : 'bg-[#FFFFFF] border-[#E5E7EB]'}`}>
                        <button 
                          onClick={() => setDefaultAction("fill")}
                          className={`px-2.5 py-1 text-[10px] font-bold rounded ${defaultAction === "fill" ? "bg-[#0284C7] text-[#FFFFFF]" : darkMode ? "text-slate-400" : "text-[#6B7280]"}`}
                        >
                          ⚡ Fill
                        </button>
                        <button 
                          onClick={() => setDefaultAction("fill_continue")}
                          className={`px-2.5 py-1 text-[10px] font-bold rounded ${defaultAction === "fill_continue" ? "bg-[#0284C7] text-[#FFFFFF]" : darkMode ? "text-slate-400" : "text-[#6B7280]"}`}
                        >
                          ⚡ Fill & Continue
                        </button>
                      </div>
                    </div>

                    <div className="space-y-1">
                      <div className="flex items-center justify-between">
                        <label className={`block font-bold text-xs ${darkMode ? 'text-slate-300' : 'text-[#6B7280]'}`}>Select Pilgrim Set</label>
                        <span className="text-[10px] font-bold text-[#0284C7]">({activeSetData.members.length} / 6 members)</span>
                      </div>
                      <div className="flex gap-2">
                        <select 
                          value={selectedSetName}
                          onChange={e => setSelectedSetName(e.target.value)}
                          className={`flex-1 p-2 border rounded-lg font-bold text-xs ${darkMode ? 'bg-slate-900 border-sky-800 text-sky-200' : 'bg-[#FFFFFF] border-[#E5E7EB] text-[#111827]'}`}
                        >
                          {pilgrimSets.map(s => (
                            <option key={s.id} value={s.name}>{s.name} ({s.members.length} Members)</option>
                          ))}
                        </select>
                      </div>
                    </div>

                    <div className={`p-2.5 border rounded-xl space-y-1.5 ${darkMode ? 'bg-slate-900 border-sky-800' : 'bg-[#FFFFFF] border-[#E5E7EB]'}`}>
                      <div className="flex items-center justify-between cursor-pointer" onClick={() => setShowSetDetails(!showSetDetails)}>
                        <p className={`font-extrabold text-[11px] ${darkMode ? 'text-slate-100' : 'text-[#111827]'}`}>Selected Set: <span className="text-[#0284C7]">{activeSetData.name}</span></p>
                        <button className="text-[#0284C7] font-bold text-xs">
                          {showSetDetails ? "▲" : "▼"}
                        </button>
                      </div>
                      {showSetDetails && (
                        <div className={`pt-2 border-t max-h-64 overflow-y-auto pr-1 ${darkMode ? 'border-sky-900' : 'border-[#E5E7EB]'}`}>
                          {activeSetData.members.length === 0 ? (
                            <p className="text-[10px] text-[#9CA3AF]">No members in this set.</p>
                          ) : (
                            activeSetData.members.map((m, idx) => (
                              <InlineMemberCard 
                                key={idx} 
                                member={m} 
                                index={idx} 
                                darkMode={darkMode}
                                onUpdate={(updated) => updatePilgrimMember(activeSetData.name, idx, updated)} 
                                onDelete={() => deletePilgrimMember(activeSetData.name, idx)} 
                              />
                            ))
                          )}
                        </div>
                      )}
                    </div>

                    <button 
                      onClick={() => addToast(`⚡ Executed Autofill for set "${activeSetData.name}"`)}
                      className="w-full py-2.5 bg-[#0284C7] hover:bg-[#0369A1] text-[#FFFFFF] rounded-xl text-xs font-extrabold transition-all shadow-xs flex items-center justify-center gap-2"
                    >
                      <span>{defaultAction === "fill_continue" ? "⚡ Fill & Continue" : "⚡ Fill Details"}</span>
                      <span className="text-[10px] bg-[#FFFFFF]/20 px-1.5 py-0.5 rounded text-[#FFFFFF] font-mono">Alt + S</span>
                    </button>
                  </div>
                </div>
              )}

              {activeTab === "srivani" && (
                <div className="p-4 space-y-3.5 text-xs">
                  <button 
                    onClick={() => addToast("⚡ Fill Srivani Details executed (Alt + A)")}
                    className="w-full py-2.5 bg-[#0284C7] hover:bg-[#0369A1] text-[#FFFFFF] rounded-xl text-xs font-extrabold shadow-md flex items-center justify-center gap-2 transition-all"
                  >
                    <span>⚡ Fill Srivani Details</span>
                    <span className="text-[10px] bg-[#FFFFFF]/20 px-1.5 py-0.5 rounded text-[#FFFFFF] font-mono">Alt + A</span>
                  </button>

                  <div className={`p-2.5 border rounded-xl space-y-2 ${darkMode ? 'bg-slate-800 border-sky-800' : 'bg-[#F0F9FF] border-[#E5E7EB]'}`}>
                    <label className={`block text-[10px] font-bold ${darkMode ? 'text-slate-300' : 'text-[#6B7280]'}`}>Select Srivani Set</label>
                    <div className="flex gap-2">
                      <select 
                        value={srivaniPreset} 
                        onChange={e => handleSrivaniPresetChange(e.target.value)}
                        className={`flex-1 p-2 border rounded-lg font-bold text-xs ${darkMode ? 'bg-slate-900 border-sky-800 text-sky-200' : 'bg-[#FFFFFF] border-[#E5E7EB] text-[#111827]'}`}
                      >
                        <option value="family">Family Set ({srivaniMembers.length} Persons)</option>
                        <option value="vip">VIP Donor Set (2 Persons)</option>
                        <option value="solo">Individual Donor Set (1 Person)</option>
                      </select>
                    </div>

                    <div className={`p-2 border rounded-lg space-y-1 mt-1 ${darkMode ? 'bg-slate-900 border-sky-800' : 'bg-[#FFFFFF] border-[#E5E7EB]'}`}>
                      <div className="flex items-center justify-between cursor-pointer" onClick={() => setShowSrivaniList(!showSrivaniList)}>
                        <p className={`font-extrabold text-[10px] ${darkMode ? 'text-slate-200' : 'text-[#111827]'}`}>Srivani Active Roster ({srivaniMembers.length}/9):</p>
                        <button className="text-[#0284C7] font-bold text-xs">
                          {showSrivaniList ? "▲" : "▼"}
                        </button>
                      </div>
                      {showSrivaniList && (
                        <div className={`pt-2 border-t max-h-64 overflow-y-auto pr-1 ${darkMode ? 'border-sky-900' : 'border-[#E5E7EB]'}`}>
                          {srivaniMembers.length === 0 ? (
                            <p className="text-[10px] text-[#9CA3AF]">No members in roster.</p>
                          ) : (
                            srivaniMembers.map((m, idx) => (
                              <InlineMemberCard 
                                key={idx} 
                                member={m} 
                                index={idx} 
                                isSrivani={true}
                                darkMode={darkMode}
                                onUpdate={(updated) => updateSrivaniMember(idx, updated)} 
                                onDelete={() => deleteSrivaniMember(idx)} 
                              />
                            ))
                          )}
                        </div>
                      )}
                    </div>
                  </div>

                  <div className={`p-3 border rounded-xl space-y-3 ${darkMode ? 'bg-slate-800 border-sky-800' : 'bg-[#FFFFFF] border-[#E5E7EB]'}`}>
                    <span className="font-extrabold text-[10px] uppercase text-[#0284C7] tracking-wider block">Booking Type</span>

                    <div className="flex items-center gap-2">
                      <input type="checkbox" id="advBook" checked={advanceBooking} onChange={e => setAdvanceBooking(e.target.checked)} className="w-4 h-4 accent-[#0284C7] rounded" />
                      <label htmlFor="advBook" className={`font-extrabold ${darkMode ? 'text-slate-200' : 'text-[#111827]'}`}>Advance Booking</label>
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className={`block text-[10px] font-bold mb-0.5 ${darkMode ? 'text-slate-300' : 'text-[#6B7280]'}`}>Break Darshan Date</label>
                        <input type="date" value={breakDate} onChange={e => setBreakDate(e.target.value)} className={`w-full p-1.5 border rounded-lg text-xs ${darkMode ? 'bg-slate-900 border-sky-800 text-[#FFFFFF]' : 'border-[#E5E7EB]'}`} />
                      </div>
                      <div>
                        <label className={`block text-[10px] font-bold mb-0.5 ${darkMode ? 'text-slate-300' : 'text-[#6B7280]'}`}>Additional Laddus (1-999)</label>
                        <input type="number" min="1" max="999" value={laddus} onChange={e => setLaddus(parseInt(e.target.value) || 1)} className={`w-full p-1.5 border rounded-lg text-xs ${darkMode ? 'bg-slate-900 border-sky-800 text-[#FFFFFF]' : 'border-[#E5E7EB]'}`} />
                      </div>
                    </div>

                    <div className={`pt-2 border-t flex items-center gap-2 ${darkMode ? 'border-sky-900' : 'border-[#E5E7EB]'}`}>
                      <input type="checkbox" id="includeAcc" checked={includeAcc} onChange={e => setIncludeAcc(e.target.checked)} className="w-4 h-4 accent-[#0284C7] rounded" />
                      <label htmlFor="includeAcc" className={`font-extrabold ${darkMode ? 'text-slate-200' : 'text-[#111827]'}`}>Include Accommodation Request</label>
                    </div>

                    {includeAcc && (
                      <div className="grid grid-cols-2 gap-2 pt-1">
                        <div>
                          <label className={`block text-[10px] font-bold mb-0.5 ${darkMode ? 'text-slate-300' : 'text-[#6B7280]'}`}>Accommodation Date</label>
                          <input type="date" value={accDate} onChange={e => setAccDate(e.target.value)} className={`w-full p-1.5 border rounded-lg text-xs ${darkMode ? 'bg-slate-900 border-sky-800 text-[#FFFFFF]' : 'border-[#E5E7EB]'}`} />
                        </div>
                        <div>
                          <label className={`block text-[10px] font-bold mb-0.5 ${darkMode ? 'text-slate-300' : 'text-[#6B7280]'}`}>Check-in Slot</label>
                          <select value={timeSlot} onChange={e => setTimeSlot(e.target.value)} className={`w-full p-1.5 border rounded-lg text-[11px] ${darkMode ? 'bg-slate-900 border-sky-800 text-[#FFFFFF]' : 'bg-[#FFFFFF]'}`}>
                            <option>00:00 Hrs to 05:59 Hrs</option>
                            <option>06:00 Hrs to 11:59 Hrs</option>
                            <option>12:00 Hrs to 17:59 Hrs</option>
                            <option>18:00 Hrs to 23:59 Hrs</option>
                          </select>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              )}

              {activeTab === "seva" && (
                <div className="p-4 space-y-3.5 text-xs">
                  <div className={`p-3 border rounded-xl space-y-2.5 ${darkMode ? 'bg-slate-800 border-sky-800' : 'bg-[#F0F9FF] border-[#E5E7EB]'}`}>
                    <div className="flex items-center justify-between">
                      <span className={`font-extrabold text-[11px] ${darkMode ? 'text-sky-300' : 'text-[#0284C7]'}`}>Primary Volunteer Profile</span>
                      <button onClick={() => { setViewMode("dashboard"); setDashboardTab("srivari_seva"); }} className="px-3 py-1 bg-[#0284C7] text-[#FFFFFF] rounded-lg font-bold hover:bg-[#0369A1]">
                        ⚡ Fill Seva Form
                      </button>

                        { title: "4. Security / Prohibited Functions", desc: "The extension does not solve CAPTCHA, bypass CAPTCHA, read OTPs without user action, bypass queues, circumvent security controls, or automate restricted booking steps.", icon: "🛡️" },
                        { title: "5. User Responsibility", desc: "Users are responsible for checking all autofilled information before submission and for complying with the official website's rules, eligibility conditions, and terms.", icon: "📋" },
                        { title: "6. Local Data Storage", desc: "Saved pilgrim/profile information is stored locally in the browser's storage where applicable. Nothing sensitive is transmitted to our servers.", icon: "💻" },
                        { title: "7. Permissions Explanation", desc: "Permissions such as storage and activeTab are required strictly to persist your saved profiles and populate form fields on active TTD tabs.", icon: "⚙️" },
                        { title: "8. Third-Party Website Disclaimer", desc: "The extension interacts with third-party websites but you do not control their availability, design changes, policies, downtime, or booking rules.", icon: "🌐" },
                        { title: "9. Payments / Pass Terms", desc: "The paid pass unlocks premium autofill duration and features. Buying a pass does not buy any TTD ticket or official temple service.", icon: "💳" },
                        { title: "10. Refund Policy", desc: "Refunds are handled on a case-by-case basis via our payment gateway. Please contact support within 48 hours if pass activation failed.", icon: "🔄" },
                        { title: "11. Data Deletion", desc: "Users can clear all local data instantly via the Trust Center reset box or by clearing browser local storage.", icon: "🗑️" },
                        { title: "12. Support Scope", desc: "Our support covers the extension itself, not official TTD booking disputes, ticket cancellations, refunds, darshan issues, or account problems on TTD's website.", icon: "🎧" }
                      ].map((item, idx) => (
                        <div key={idx} className={`p-4 border rounded-xl space-y-1.5 shadow-sm ${darkMode ? 'bg-slate-800 border-sky-800' : 'bg-[#FFFFFF] border-[#E5E7EB]'}`}>
                          <div className="flex items-center gap-2">
                            <span>{item.icon}</span>
                            <h4 className={`font-extrabold text-xs ${darkMode ? 'text-white' : 'text-[#111827]'}`}>{item.title}</h4>
                          </div>
                          <p className="text-[11px] text-[#6B7280] leading-relaxed">{item.desc}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Disclaimer Modal */}
          {showDisclaimerModal && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-[#111827]/60 backdrop-blur-sm">
              <div className={`w-full max-w-md p-6 rounded-2xl shadow-2xl ${darkMode ? 'bg-slate-900 border border-sky-800' : 'bg-[#FFFFFF] border border-[#E5E7EB]'}`}>
                 <div className={`flex items-center justify-between mb-4 border-b pb-3 ${darkMode ? 'border-sky-800' : 'border-[#E5E7EB]'}`}>
                   <h3 className={`font-black text-sm flex items-center gap-2 ${darkMode ? 'text-[#FFFFFF]' : 'text-[#111827]'}`}>
                     <span className="text-xl">⚠️</span> Legal Disclaimer & Terms
                   </h3>
                   <button onClick={() => setShowDisclaimerModal(false)} className={`text-xl font-bold leading-none ${darkMode ? 'text-slate-400 hover:text-[#FFFFFF]' : 'text-[#6B7280] hover:text-[#111827]'}`}>&times;</button>
                 </div>
                 <p className={`text-xs leading-relaxed text-justify ${darkMode ? 'text-slate-300' : 'text-[#6B7280]'}`}>
                   TTD Darshan Autofill is an independent browser extension designed to help users save and autofill information they provide. It is not affiliated with, endorsed by, sponsored by, or officially connected with Tirumala Tirupati Devasthanams (TTD). The extension does not guarantee ticket availability, booking confirmation, payment success, darshan, accommodation, or any other official service. Users are responsible for reviewing all information before submission and for complying with the rules and terms of the official TTD website.
                 </p>
                 <button onClick={() => setShowDisclaimerModal(false)} className="w-full mt-5 py-2.5 bg-[#0284C7] hover:bg-[#0369A1] text-[#FFFFFF] rounded-xl font-bold text-xs transition-colors shadow-sm">
                   I Understand
                 </button>
              </div>
            </div>
          )}

          {/* Toast Notifications */}
          <div className="fixed bottom-4 right-4 z-50 space-y-2 pointer-events-none">
            {toasts.map(t => (
              <div key={t.id} className={`px-4 py-3 rounded-lg shadow-lg font-bold text-sm flex items-center gap-2 animate-[slideIn_0.3s_ease-out] ${darkMode ? 'bg-sky-600 text-[#FFFFFF]' : 'bg-[#16A34A] text-[#FFFFFF]'}`}>
                <span>✓</span>
                <span>{t.msg}</span>
              </div>
            ))}
          </div>

        </div>
      );
    }

    const container = document.getElementById('root');
    if (container) {
      ReactDOM.createRoot(container).render(<App />);
    }
  </script>
</body>
</html>
